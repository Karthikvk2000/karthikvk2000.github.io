<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Inbox</title>
<style>body{background:#0A0A0C;color:#F2F1EC;font:16px/1.6 system-ui,sans-serif;max-width:640px;margin:0 auto;padding:28px}input,button{font:inherit;padding:10px;margin:4px 0;background:#131317;color:#F2F1EC;border:1px solid #35353D}input{width:100%}button{cursor:pointer;color:#F2C230;border-color:#F2C230}.m{border-top:1px solid #35353D;padding:14px 0}.m small{color:#6C6C76;display:flex;justify-content:space-between}.m p{white-space:pre-wrap;word-break:break-word}h1{color:#F2C230}</style></head><body>
<h1>Inbox</h1><div id="login"><input id="e" type="email" placeholder="Email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Sign in</button> <span id="st"></span></div><div id="list"></div>
<script>
var URL_='https://fckfoeaahzveyxprpbzh.supabase.co',KEY='sb_publishable_4l6Jnw0c3F9fPkyyqkL3sA_Tvl4aHfz',tok=null,$=function(i){return document.getElementById(i)};
function H(){return{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'}}
async function load(){var r=await fetch(URL_+'/rest/v1/messages?select=*&order=created_at.desc',{headers:H()});var rows=await r.json(),l=$('list');l.textContent='';if(!rows.length){l.textContent='No messages yet.';return}
rows.forEach(function(m){var d=document.createElement('div');d.className='m';var s=document.createElement('small');var w=document.createElement('span');w.textContent=new Date(m.created_at).toLocaleString();var b=document.createElement('button');b.textContent='Delete';b.onclick=async function(){await fetch(URL_+'/rest/v1/messages?id=eq.'+m.id,{method:'DELETE',headers:H()});load()};s.append(w,b);var p=document.createElement('p');p.textContent=m.text;d.append(s,p);l.append(d)})}
$('go').onclick=async function(){$('st').textContent='';var r=await fetch(URL_+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('e').value,password:$('p').value})});var j=await r.json();if(!j.access_token){$('st').textContent='Sign-in failed.';return}tok=j.access_token;$('login').hidden=true;load()};
</script></body></html>
